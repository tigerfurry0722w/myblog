<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投票受理確認</title>
    <style>
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, "PingFang TC", "Hiragino Sans GB", "Microsoft JhengHei", sans-serif;
            background-color: #f8f9fa;
            color: #333333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 30px;
            max-width: 680px;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }
        h1 {
            color: #2c3e50;
            font-size: 28px;
            margin-bottom: 8px;
        }
        .status-message {
            font-size: 20px;
            color: #2ecc71;
            font-weight: bold;
            margin-bottom: 30px;
        }
        .divider {
            height: 1px;
            background-color: #e0e0e0;
            margin: 25px 0;
        }
        .problem-title {
            font-size: 18px;
            color: #e74c3c;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .iframe-wrapper {
            position: relative;
            width: 100%;
            overflow: hidden;
            margin-bottom: 25px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }
        iframe {
            width: 100%;
            max-width: 640px;
            display: block;
            margin: 0 auto;
        }
        .line-section {
            margin-top: 20px;
            font-size: 16px;
        }
        .line-button {
            display: inline-block;
            background-color: #06C755;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        .line-button:hover {
            background-color: #05b34c;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- 💡 感謝與狀態顯示區 -->
        <h1>謝謝 🎉</h1>
        <div class="status-message">您的投票已受理 👍</div>

        <div class="divider"></div>

        <!-- 💡 問題回報與表單區 -->
        <div class="problem-title">遇到問題了嗎？ 🤔</div>
        <p style="color: #666; margin-bottom: 15px;">請填寫下方表單回報給我們：</p>
        
        <div class="iframe-wrapper">
            <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSeXzxSy8LtpWqrW82naULjQO6eGc8q46rqDJ0ziOvccXbnHNw/viewform?embedded=true" width="640" height="1574" frameborder="0" marginheight="0" marginwidth="0">載入中…</iframe>
        </div>
        
        <div class="divider"></div>

        <!-- 💡 LINE 聯絡區 -->
        <div class="line-section">
            <p>或直接透過 LINE 與我們聯繫：</p>
            <a href="https://lin.ee/nCzNTNv" target="_blank" class="line-button">💬 點擊加入 LINE 官方帳號</a>
        </div>
    </div>

</body>
</html>
